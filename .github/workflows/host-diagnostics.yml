name: Production Host Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Inspect deployment storage
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            echo 'Filesystem capacity (KB)'
            df -Pk / /tmp /home
            echo 'SlickHood frontend release directories (KB)'
            sudo du -sk /home/silverocean/deploy /home/silverocean/deploy.candidate-* /home/silverocean/deploy.rollback-* 2>/dev/null || true
            echo 'Frontend transport directory (KB)'
            sudo du -sk /tmp/slickhood-frontend-release 2>/dev/null || true
            echo 'SlickHood backend release artifacts (KB)'
            sudo du -sk /home/silverocean/backend/silverocean-0.0.1-SNAPSHOT.jar \
              /home/silverocean/backups/backend-*.jar \
              /tmp/slickhood-backend-release 2>/dev/null || true
            echo 'Protected pending-release backups (KB)'
            sudo du -sk /home/silverocean/backups/pending-release-* 2>/dev/null || true
            echo 'Backend service state'
            sudo systemctl show pms.service \
              --property=ActiveState,SubState,Result,NRestarts,ExecMainCode,ExecMainStatus
            echo 'Recent backend startup error classes (counts only)'
            journal="$(sudo journalctl -u pms.service --since '30 minutes ago' --no-pager)"
            for signature in \
              BeanCreationException UnsatisfiedDependencyException FlywayValidateException \
              SQLSyntaxErrorException SchemaManagementException OutOfMemoryError BindException \
              IllegalArgumentException ApplicationContextException; do
              count="$(printf '%s' "$journal" | grep -cF "$signature" || true)"
              printf '%s=%s\n' "$signature" "$count"
            done
            unset journal
