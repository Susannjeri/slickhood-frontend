name: Frontend quality gate

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Static analysis
        run: |
          node --test scripts/validate-build-env.test.mjs
          npm run lint:ci
      - name: Production build
        env:
          # CI verifies the deployable bundle without production credentials.
          # The deployment workflow supplies and validates the real production URL.
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8080
        run: npm run build
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Browser regression suite
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
