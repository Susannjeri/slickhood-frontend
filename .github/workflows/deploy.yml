name: Deploy PMS to server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static analysis
        run: npm run lint:ci

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Browser regression suite
        run: npm run test:e2e

      - name: Copy env production configs
        run: |
          cat > .env.production <<'EOF'
          ${{ secrets.ENV_PRODUCTION }}
          EOF

      - name: Build and package deployment binaries
        run:  |
          chmod +x ./build.sh
          ./build.sh

      - name: Create release checksum
        run: sha256sum deploy.tar.gz > release.sha256

      - name: SCP archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.tar.gz,release.sha256"
          target: ${{ secrets.TARGET_DIR }}/incoming/${{ github.sha }}

      - name: Extract and restart on remote
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            target_dir='${{ secrets.TARGET_DIR }}'
            staged_dir="$target_dir/incoming/${{ github.sha }}"
            health_url='${{ secrets.FRONTEND_HEALTHCHECK_URL }}'
            test -n "$target_dir" && test -n "$health_url"
            cd "$staged_dir"
            sha256sum -c release.sha256
            backup_dir="$target_dir/rollback/${{ github.sha }}"
            mkdir -p "$backup_dir"
            if test -f "$target_dir/deploy.tar.gz"; then
              cp "$target_dir/deploy.tar.gz" "$backup_dir/deploy.tar.gz"
            fi
            cp deploy.tar.gz "$target_dir/deploy.tar.gz.next"
            mv "$target_dir/deploy.tar.gz.next" "$target_dir/deploy.tar.gz"
            cd "$target_dir"
            ./gangnam.sh
            healthy=false
            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error "$health_url" >/dev/null; then healthy=true; break; fi
              sleep 2
            done
            if test "$healthy" != true; then
              if test -f "$backup_dir/deploy.tar.gz"; then
                cp "$backup_dir/deploy.tar.gz" "$target_dir/deploy.tar.gz.next"
                mv "$target_dir/deploy.tar.gz.next" "$target_dir/deploy.tar.gz"
                ./gangnam.sh
              fi
              echo "Health check failed; frontend rollback was attempted." >&2
              exit 1
            fi
