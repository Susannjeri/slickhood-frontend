name: Deploy PMS to server

on:
  workflow_dispatch:

concurrency:
  group: slickhood-frontend-production
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static analysis
        run: |
          node --test scripts/validate-build-env.test.mjs
          npm run lint:ci

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Copy env production configs
        run: |
          cat > .env.production <<'EOF'
          ${{ secrets.ENV_PRODUCTION }}
          EOF

      - name: Verify backend and public production prerequisites
        env:
          BACKEND_HEALTHCHECK_URL: ${{ secrets.BACKEND_HEALTHCHECK_URL }}
          SLICKHOOD_PRODUCTION_URL: https://app.slickhood.com
        run: npm run preflight:production

      - name: Install Chromium for authentication regression tests
        run: npx playwright install --with-deps chromium

      - name: Build the exact production frontend
        env:
          NEXT_PUBLIC_COMMIT_HASH: ${{ github.sha }}
        run: npm run build

      - name: Browser regression suite
        env:
          E2E_USE_STANDALONE: 'true'
          # The build guard requires a valid production Maps key. Exercise its
          # configured-key test; missing-key cases belong to the no-key CI build.
          E2E_HAS_GOOGLE_MAPS: 'true'
        run: npm run test:e2e

      - name: Run mandatory authentication and onboarding regression gate
        env:
          E2E_USE_STANDALONE: 'true'
          E2E_HAS_GOOGLE_MAPS: 'true'
        run: npx playwright test e2e/auth.spec.ts e2e/auth-layout.spec.ts e2e/registration-subscription.spec.ts

      - name: Build and package deployment binaries
        env:
          NEXT_PUBLIC_COMMIT_HASH: ${{ github.sha }}
        run:  |
          chmod +x ./build.sh
          SKIP_BUILD=true ./build.sh

      - name: Create release checksum
        run: sha256sum deploy.tar.gz > release.sha256

      - name: SCP archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.tar.gz,release.sha256"
          target: /tmp/slickhood-frontend-release

      - name: Smoke candidate and perform rollback-safe cutover
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            candidate="/home/silverocean/deploy.candidate-$stamp"
            rollback="/home/silverocean/deploy.rollback-$stamp"
            candidate_unit="slickhood-frontend-candidate-$stamp"
            cutover_started=false
            restore_previous_release() {
              if [ "$cutover_started" = "true" ] && [ -d "$rollback" ]; then
                sudo -u silverocean pm2 stop nextjs || true
                if [ -d /home/silverocean/deploy ]; then
                  sudo mkdir -p "$candidate"
                  sudo mv /home/silverocean/deploy "$candidate/failed-deploy"
                fi
                sudo mv "$rollback" /home/silverocean/deploy
                sudo -u silverocean sh -c 'cd /home/silverocean/deploy && NODE_ENV=production pm2 restart nextjs --update-env' || true
              fi
            }
            cleanup() {
              status=$?
              trap - EXIT
              if [ -n "$candidate_unit" ]; then
                sudo systemctl stop "$candidate_unit" 2>/dev/null || true
              fi
              if [ "$status" -ne 0 ]; then
                restore_previous_release
              fi
              exit "$status"
            }
            trap cleanup EXIT
            cd /tmp/slickhood-frontend-release
            sha256sum -c release.sha256
            sudo mkdir -p "$candidate"
            sudo tar -xzf /tmp/slickhood-frontend-release/deploy.tar.gz -C "$candidate"
            sudo chown -R silverocean:silverocean "$candidate"
            test -f "$candidate/deploy/server.js"
            grep -RqsF '${{ github.sha }}' "$candidate/deploy/.next/static/chunks"
            # Never let an orphaned server satisfy a different release's smoke test.
            test -z "$(sudo ss -H -ltn 'sport = :3101')"
            sudo systemd-run --unit="$candidate_unit" --collect \
              --property=User=silverocean --property=KillMode=control-group \
              --property="WorkingDirectory=$candidate/deploy" \
              --setenv=PORT=3101 --setenv=HOSTNAME=127.0.0.1 --setenv=NODE_ENV=production \
              /usr/bin/node server.js
            candidate_ready=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:3101/login >/dev/null 2>&1; then
                candidate_ready=true
                break
              fi
              sleep 1
            done
            test "$candidate_ready" = true
            sudo systemctl stop "$candidate_unit"
            test -z "$(sudo ss -H -ltn 'sport = :3101')"
            candidate_unit=""
            cutover_started=true
            sudo -u silverocean pm2 stop nextjs
            sudo mv /home/silverocean/deploy "$rollback"
            sudo mv "$candidate/deploy" /home/silverocean/deploy
            sudo chown -R silverocean:silverocean /home/silverocean/deploy
            sudo -u silverocean sh -c 'cd /home/silverocean/deploy && NODE_ENV=production pm2 restart nextjs --update-env'
            sleep 8
            curl --fail --silent --show-error https://app.slickhood.com/login >/dev/null
            cutover_started=false

      - name: Verify production authentication contract
        run: bash ./scripts/verify-auth-production.sh

      - name: Verify production dependency contract after cutover
        env:
          BACKEND_HEALTHCHECK_URL: ${{ secrets.BACKEND_HEALTHCHECK_URL }}
          SLICKHOOD_PRODUCTION_URL: https://app.slickhood.com
        run: npm run preflight:production
