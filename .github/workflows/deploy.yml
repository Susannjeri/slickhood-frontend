name: Deploy PMS to server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: slickhood-frontend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Copy env production configs
        run: |
          cat > .env.production <<'EOF'
          ${{ secrets.ENV_PRODUCTION }}
          EOF

      - name: Install Chromium for authentication regression tests
        run: npx playwright install --with-deps chromium

      - name: Build the exact production frontend
        run: npm run build

      - name: Run mandatory authentication and onboarding regression gate
        run: npx playwright test e2e/auth.spec.ts e2e/auth-layout.spec.ts e2e/registration-subscription.spec.ts

      - name: Build and package deployment binaries
        run:  |
          chmod +x ./build.sh
          ./build.sh

      - name: SCP archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.tar.gz"
          target: ${{ secrets.TARGET_DIR }}

      - name: Extract and restart on remote
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            ./gangnam.sh

      - name: Verify production authentication contract
        run: bash ./scripts/verify-auth-production.sh
