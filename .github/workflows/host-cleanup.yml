name: Production Frontend Storage Cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Remove approved stale frontend releases
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 8m
          script: |
            set -eu
            active=/home/silverocean/deploy
            test -d "$active"
            test "$(realpath "$active")" = /home/silverocean/deploy
            remove_stale_release() {
              stale="$1"
              test -d "$stale"
              test ! -L "$stale"
              resolved="$(realpath "$stale")"
              case "$resolved" in
                /home/silverocean/deploy.rollback-*|/home/silverocean/deploy.candidate-*) ;;
                *) echo "Refusing unexpected cleanup target: $resolved" >&2; exit 1 ;;
              esac
              test "$resolved" != "$active"
              sudo rm -rf -- "$resolved"
            }
            # Keep the two newest complete frontend releases for immediate
            # recovery, and remove only older exact-prefix rollback folders.
            find /home/silverocean -maxdepth 1 -type d -name 'deploy.rollback-*' -printf '%T@ %p\n' \
              | sort -nr \
              | tail -n +3 \
              | cut -d' ' -f2- \
              | while IFS= read -r stale; do
                  [ -n "$stale" ] || continue
                  remove_stale_release "$stale"
                done
            for candidate in /home/silverocean/deploy.candidate-*; do
              [ -d "$candidate" ] || continue
              test ! -L "$candidate"
              resolved="$(realpath "$candidate")"
              case "$resolved" in
                /home/silverocean/deploy.candidate-*) ;;
                *) echo "Refusing unexpected candidate target: $resolved" >&2; exit 1 ;;
              esac
              if [ -n "$(find "$resolved" -mindepth 1 -print -quit)" ]; then
                echo "Retaining non-empty candidate release: $resolved"
                continue
              fi
              remove_stale_release "$resolved"
            done
            staging=/tmp/slickhood-frontend-release
            test "$staging" = /tmp/slickhood-frontend-release
            if [ -e "$staging" ]; then
              test ! -L "$staging"
              sudo rm -rf -- "$staging"
            fi
            backend_staging=/tmp/slickhood-backend-release
            test "$backend_staging" = /tmp/slickhood-backend-release
            if [ -e "$backend_staging" ]; then
              test ! -L "$backend_staging"
              sudo rm -rf -- "$backend_staging"
            fi
            # Backend JAR rollbacks are small, immediately usable recovery
            # artifacts. Keep the two newest and remove only older exact-name
            # files. Protected database backups are deliberately not touched.
            find /home/silverocean/backups -maxdepth 1 -type f -name 'backend-*.jar' -printf '%T@ %p\n' \
              | sort -nr \
              | tail -n +3 \
              | cut -d' ' -f2- \
              | while IFS= read -r old_backend; do
                  [ -n "$old_backend" ] || continue
                  test ! -L "$old_backend"
                  resolved="$(realpath "$old_backend")"
                  case "$resolved" in
                    /home/silverocean/backups/backend-*.jar) sudo rm -f -- "$resolved" ;;
                    *) echo "Refusing unexpected backend rollback target: $resolved" >&2; exit 1 ;;
                  esac
                done
            test -f "$active/server.js"
            test -f /home/silverocean/backend/silverocean-0.0.1-SNAPSHOT.jar
            echo 'Capacity after approved cleanup (KB)'
            df -Pk /
